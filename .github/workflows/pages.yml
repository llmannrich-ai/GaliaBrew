# Publica a pasta portal/ no GitHub Pages: https://llmannrich-ai.github.io/GaliaBrew/
# Roda a cada push que mude o portal (ou à mão, em Actions → "Publicar portal" → Run workflow).
# Só publica a partir da branch PADRÃO do repositório (regra do ambiente github-pages).
# Antes, uma vez: Settings → Pages → Build and deployment → Source = "GitHub Actions".
name: Publicar portal

on:
  push:
    branches: [main, claude/gallant-hypatia-oyvzpp]
    paths: ["portal/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Um grupo por branch: o push na main (que não publica) não cancela a publicação da branch padrão.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

# Dois jobs (montar → publicar), como no modelo do GitHub: com tudo num job só, o "deploy-pages" às vezes não achava o
# pacote recém-enviado ("No artifacts named github-pages", 23-24/11/2026, 5 falhas seguidas).
jobs:
  montar:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Testes do cálculo
        run: node --test portal/testes/*.test.mjs

      - name: Montar o site (sem a pasta de testes)
        run: |
          mkdir _site
          cp -r portal/. _site/
          rm -rf _site/testes _site/_headers

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publicar:
    needs: montar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - id: publicacao
        uses: actions/deploy-pages@v4
